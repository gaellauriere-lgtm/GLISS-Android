
name: Build GLISS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android.yml'
      - '*.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Extraire le projet GLISS
        run: |
          mkdir source
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          unzip -q "$ZIP" -d source

      - name: Compiler APK
        run: gradle -p source/GLISS-Android assembleDebug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: GLISS-APK
          path: source/GLISS-Android/app/build/outputs/apk/debug/app-debug.apk
